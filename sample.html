<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="row">
      <!-- Product Image -->
      <div class="col-md-6 mb-4">
        <img src="product-image.jpg" alt="Product Image" class="img-fluid rounded">
      </div>

      <!-- Product Details -->
      <div class="col-md-6">
        <h2 class="product-title">Product Name</h2>
        <p class="product-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam eget nulla et odio tincidunt.</p>
        <p class="product-price">$99.99</p>

        <!-- Quantity Form -->
        <form action="/add-to-cart" method="POST" class="mb-3">
          <div class="row">
            <div class="col-6">
              <label for="quantity" class="form-label">Quantity</label>
              <input type="number" id="quantity" name="quantity" class="form-control" min="1" max="10" value="1">
            </div>
            <div class="col-6">
              <label for="color" class="form-label">Color</label>
              <select id="color" name="color" class="form-select">
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
              </select>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary mt-3">Add to Cart</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
